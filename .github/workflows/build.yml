name: Build Signed APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # === Decode Keystore ===
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/lazyowl.keystore

      # === Build Release APK (Signed) ===
      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/lazyowl.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Electrical-Lab-${{ github.ref_name }}.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrical-Lab-Signed-APK
          path: release/*.apk

      - name: Create Release (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Electrical Lab ${{ github.ref_name }}
          body: |
            ## ⚡ Electrical Engineering Lab ${{ github.ref_name }}
            **By Snow Owl 🦉**
            **Signature:** Yasir_Khan

            ### 🎯 All-in-One Calculator
            - Motor · VFD · Gearbox · Blower · Conveyor
            - Starter · Breakers · Busbar · Wire · Load
            - Instruments · 4-20mA · CT/PT Metering
            - Cable & Motor Wire Datasheets
            - Ladder Logic · Star-Delta Simulation
            - 3D Motor View · Live Sim · Trend · Log
            - Modbus TCP / Profibus
            - Dark / Light Mode

            ### 📱 Installation
            1. Download APK below
            2. Enable "Install from Unknown Sources"
            3. Install and enjoy!

            **Signed Release APK** ✅
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
