name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true
      
      - name: Install dependencies
        run: npm install
      
      - name: Add Android platform
        run: npx cap add android
      
      - name: Sync web assets
        run: npx cap sync android
      
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Electrical-Lab-${{ github.ref_name }}.apk
      
      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Electrical-Lab-APK
          path: release/Electrical-Lab-*.apk
      
      - name: Create Release (Auto)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Electrical Lab ${{ github.ref_name }}
          body: |
            ## ⚡ Electrical Engineering Lab ${{ github.ref_name }}
            
            **By Lazy Owl 🦉**
            
            ### 🎯 All-in-One Calculator
            - 🔌 Motor · 🔄 VFD · ⚙️ Gearbox · 💨 Blower · 🏭 Conveyor
            - 🚀 Starter · ⚡ Breakers · 📏 Busbar · 🔧 Wire · 📊 Load
            - 🎛️ Instruments · 4-20mA Loop · CT/PT Metering
            - 📄 Cable & Motor Wire Datasheets
            - 🪜 Ladder Logic · Star-Delta Simulation
            - 🎯 3D Motor View · 📈 Live Sim · 📉 Trend · 📋 Log
            - 🔌 Modbus TCP / Profibus
            - 🌙 Dark / ☀️ Light Mode
            
            ### 📱 Installation
            1. Download APK below
            2. Enable "Install from Unknown Sources"
            3. Install and enjoy!
            
            **Made with ❤️ by Lazy Owl**
          files: release/Electrical-Lab-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
