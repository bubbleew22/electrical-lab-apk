name: Build APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      # capacitor.config.json uses webDir: "www"
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            APK_NAME="Electrical-Lab-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="Electrical-Lab-latest.apk"
          fi

          cp android/app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electrical-Lab-APK
          path: release/*.apk
          if-no-files-found: error

      # Updates one permanent release called "latest" for main/master pushes
      - name: Update Latest Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Electrical Lab - Latest Build
          body: |
            ## Electrical Lab - Latest APK

            This release is automatically updated after every successful build.

            Commit: `${{ github.sha }}`

            Download the APK below and install it on your Android device.
          files: release/*.apk
          prerelease: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Creates a separate release for tags such as v1.0.0
      - name: Create Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Electrical Lab ${{ github.ref_name }}
          body: |
            ## ⚡ Electrical Engineering Lab ${{ github.ref_name }}

            **By Lazy Owl 🦉**

            ### Features

            - Motor, VFD, gearbox, blower, and conveyor calculators
            - Star-delta simulation
            - Ladder logic
            - Cable and motor wire datasheets
            - Modbus TCP and Profibus
            - Dark and light mode

            ### Installation

            1. Download the APK below.
            2. Enable installation from unknown sources.
            3. Install the APK on your Android device.
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
